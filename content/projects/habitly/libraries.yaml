# Registry of every external library the Habitly workspace declares.
# Generated tables, matrix, map, and checks all read this file (via
# generated/libraries.json). Reasons were verified against the imports
# in the code; nothing here is guessed from a package name.
#
# "Declared but not used in source" means no scanned source imports it.
# Most Expo SDK surface is wired through app.json plugins and native code
# rather than TypeScript imports; those entries say so in their reason.
libraries:
  - id: expo
    displayName: Expo
    category: Mobile framework
    why: App runtime, dev server, and Metro bundler configuration.
    homepage: https://expo.dev
    uses:
      .: Metro config plus the managed runtime underneath every screen.
    featured: [.]

  - id: react
    displayName: React
    category: Mobile framework
    why: UI library behind every screen and component.
    homepage: https://react.dev
    uses:
      .: All screens, providers, and components under src/.
    featured: [.]

  - id: react-native
    displayName: React Native
    category: Mobile framework
    why: Native primitives and app-state hooks the app is built from.
    homepage: https://reactnative.dev
    uses:
      .: Primitives in every screen plus AppState in cloud sync.
    featured: [.]

  - id: expo-router
    displayName: Expo Router
    category: Navigation
    why: File-based routing for tabs, stacks, and deep links.
    homepage: https://docs.expo.dev/router/introduction/
    uses:
      .: Route table under src/app with typed route helpers.
    featured: [.]

  - id: react-native-screens
    displayName: react-native-screens
    category: Navigation
    why: Native screen containers behind the router; never imported in app sources.
    homepage: https://github.com/software-mansion/react-native-screens

  - id: react-native-safe-area-context
    displayName: react-native-safe-area-context
    category: Navigation
    why: Notch and gesture-bar insets for layout and the tab bar.
    homepage: https://github.com/th3rdwave/react-native-safe-area-context
    uses:
      .: Safe-area providers, hooks, and initial metrics in layouts.

  - id: react-native-gesture-handler
    displayName: react-native-gesture-handler
    category: Navigation
    why: Gesture root view and swipe handling for the tab pager.
    homepage: https://docs.swmansion.com/react-native-gesture-handler/
    uses:
      .: Root view in the app layout plus the swipeable tabs.

  - id: expo-status-bar
    displayName: expo-status-bar
    category: Mobile framework
    why: Status bar styling for the root layout.
    homepage: https://docs.expo.dev/versions/latest/sdk/status-bar/
    uses:
      .: StatusBar in the root layout.

  - id: expo-constants
    displayName: expo-constants
    category: Mobile framework
    why: App metadata access; declared but not imported in scanned sources.
    homepage: https://docs.expo.dev/versions/latest/sdk/constants/

