# Slots for tutorial photography. All photos are placeholders until
# shot and uploaded to public/media/javascript/ (never hotlinked).
# check-topics.ts requires every slot used on a page to be registered
# here with a shot note.
slots:
  devtools-call-stack:
    note: >-
      Chrome DevTools Sources panel paused on a breakpoint, Call Stack
      pane visible with three named frames, 1280px or wider, UI text
      readable. Any small demo page, no personal data.
  devtools-performance:
    note: >-
      Chrome DevTools Performance panel showing a recorded long task
      (red triangle) blocking the main thread, flame chart visible,
      1280px or wider.
  devtools-memory:
    note: >-
      Chrome DevTools Memory panel after taking a heap snapshot,
      summary view with constructor names visible, 1280px or wider.
  devtools-network:
    note: >-
      Chrome DevTools Network panel showing a fetch request with
      timing waterfall, 1280px or wider, example.com-style fake host.
